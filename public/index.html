<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUNGEON QUEST | Ancient Secrets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Initial Loading/Login -->
    <div id="login-screen">
        <div class="login-box glass">
            <h1>DUNGEON</h1>
            <p style="color: var(--primary); font-weight: 700; letter-spacing: 0.2em; margin-bottom: 2rem;">QUEST</p>
            
            <input type="text" id="playerName" class="input-field" placeholder="Enter Hero Name..." maxlength="12" value="Hero">
            <button class="start-btn" onclick="startGame()">ENTER THE DARKNESS</button>
        </div>
    </div>

    <!-- Main Game Context -->
    <div id="game-container" class="hidden">
        <!-- Player Stats -->
        <div id="stats-panel" class="hud glass">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <span id="p-name" style="font-weight: 700; color: #fff;">Hero</span>
                <span style="color: var(--secondary); font-size: 0.8125rem; font-weight: 800;">LV. <span id="p-level">1</span></span>
            </div>
            
            <div class="stat-row">
                <div class="stat-label"><span>Health</span><span id="txt-hp">100/100</span></div>
                <div class="bar"><div id="bar-hp" class="bar-fill hp" style="width: 100%;"></div></div>
            </div>
            <div class="stat-row">
                <div class="stat-label"><span>Mana</span><span id="txt-mp">50/50</span></div>
                <div class="bar"><div id="bar-mp" class="bar-fill mp" style="width: 100%;"></div></div>
            </div>
            <div class="stat-row" style="margin-bottom: 0;">
                <div class="stat-label"><span>Exp</span><span id="txt-xp">0/100</span></div>
                <div class="bar"><div id="bar-xp" class="bar-fill xp" style="width: 0%;"></div></div>
            </div>
        </div>

        <!-- Right Side: Info & Minimap -->
        <div id="info-panels" class="hud">
            <div class="panel-sm glass online-count">
                <div class="dot"></div>
                <span><span id="online-val">1</span> ONLINE</span>
                <i id="btn-invite" class="fa-solid fa-share-nodes" style="margin-left: auto; cursor: pointer; color: var(--primary);"></i>
            </div>
            
            <div id="minimap-box" class="glass">
                <div id="mmap" style="width: 100%; height: 100%; position: relative;"></div>
            </div>

            <!-- Current Goal -->
            <div class="panel-sm glass" style="width: 200px;">
                <div style="font-size: 0.75rem; color: var(--secondary); font-weight: 800; margin-bottom: 0.25rem;">CURRENT QUEST</div>
                <div id="quest-desc" style="font-size: 0.8125rem; line-height: 1.4;">Explore the depths and reach Level 5 to find the Portal.</div>
            </div>
        </div>

        <!-- Notification Center -->
        <div id="notif-center" class="hud"></div>

        <!-- Bottom: Chat & Hotbar -->
        <div id="bottom-hud" class="hud">
            <div id="chat-box" class="glass">
                <div id="messages"></div>
                <input type="text" id="chat-in" placeholder="Press Enter to chat...">
            </div>

            <div style="display: flex; flex-direction: column; align-items: center; gap: 0.75rem;">
                <!-- Abilities -->
                <div class="hotbar glass" style="padding: 0.5rem;">
                    <div class="slot" title="Special (Q)"><span class="key">Q</span>⚡</div>
                    <div class="slot" title="Ultimate (E)"><span class="key">E</span>🔥</div>
                </div>
                <!-- Inventory -->
                <div class="hotbar glass">
                    <div id="inv-0" class="slot"><span class="key">1</span></div>
                    <div id="inv-1" class="slot"><span class="key">2</span></div>
                    <div id="inv-2" class="slot"><span class="key">3</span></div>
                    <div id="inv-3" class="slot"><span class="key">4</span></div>
                    <div id="inv-4" class="slot"><span class="key">5</span></div>
                </div>
            </div>

            <!-- Position Info -->
            <div class="panel-sm glass" style="min-width: auto; height: fit-content; display: flex; gap: 1rem; font-size: 0.75rem; color: #94a3b8;">
                <span><i class="fa-solid fa-location-dot"></i> <span id="pos-val">0, 0</span></span>
                <span><i class="fa-solid fa-coins"></i> <span id="gold-val">0</span></span>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <script src="game.js"></script>
</body>
</html>
